# Checks every pull request and push to main: types, lint, tests, build, dependency audit.
name: CI
on:
  pull_request: # runs on pull requests (no secrets are used)
  push:
    branches: [main] # and after merges to main
permissions:
  contents: read # least privilege: read-only token
jobs:
  check:
    runs-on: ubuntu-latest # standard runner
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2, pinned by commit
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0, pinned by commit
        with:
          node-version: 22 # current LTS
          cache: npm # reuse the npm cache
      - run: npm ci # install exactly what the lockfile says
      - run: npx tsc -b # type check
      - run: npx oxlint # lint
      - run: npx vitest run # unit tests
      - run: npx vite build # production build
      - run: npm audit --omit=dev --audit-level=high # known-vulnerable runtime packages
